[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veydra-model-standard"
version = "1.0.0"
description = "Standalone runtime and parser package for Veydra system dynamics models"
authors = [{name = "Veydra Team", email = "support@veydra.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.0.0",
    "pandas>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/veydra/veydra-model-standard"
Repository = "https://github.com/veydra/veydra-model-standard"

[tool.setuptools]
license-files = ["LICENSE"]